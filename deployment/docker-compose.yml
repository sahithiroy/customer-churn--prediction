version: "3.9"

services:

  fastapi:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: churn-fastapi
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  streamlit:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: churn-streamlit
    ports:
      - "8501:8501"
    command: streamlit run dashboard/streamlit_app.py --server.port 8501
    depends_on:
      - fastapi